services:
  - type: web
    name: routinegap-youcam
    runtime: node
    buildCommand: npm run check && npm test
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: LIVE_SCANS_ENABLED
        value: 'false'
      - key: YOUCAM_API_KEY
        sync: false
      - key: DEMO_ACCESS_TOKEN
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
