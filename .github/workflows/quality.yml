name: Quality checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-test:
    name: Syntax and regression tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run deterministic unit and mock HTTP tests
        run: npm test
