<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 940 430">
<title id="title">Skin photo guide: good front-facing photo compared with too-small low-detail photo</title>
<desc id="desc">The left green example shows a large, evenly lit, centered face with uncovered forehead, 960 by 1280 pixels. The right peach example shows a small poorly lit portrait at 236 by 354 pixels that is unsuitable for skin analysis. These are educational illustrations, not real skin scans.</desc>
<defs>
<linearGradient id="cream" x2="1" y2="1"><stop stop-color="#fcfaf5"/><stop offset="1" stop-color="#f3f7f0"/></linearGradient>
<linearGradient id="face" x2=".85" y2="1"><stop stop-color="#eebda0"/><stop offset=".6" stop-color="#e8ac8f"/><stop offset="1" stop-color="#ca8a72"/></linearGradient>
<linearGradient id="dim" x2="0" y2="1"><stop stop-color="#9c9a94"/><stop offset="1" stop-color="#5f6867"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="2.4"/></filter>
</defs>
